services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - 54327:5432
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_DB}
  admin:
    image: dpage/pgadmin4
    container_name: 69-s3-admin
    ports:
      - 8083:80
    environment:
       - PGADMIN_DEFAULT_EMAIL=jeerapol-y@rmutp.ac.th
       - PGADMIN_DEFAULT_PASSWORD=P@ssw0rd*10
  app:
    image: prawee/strapi
    container_name: 69-s3-app
    ports:
      - 8080:1337
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_NAME=${DATABASE_DB}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
