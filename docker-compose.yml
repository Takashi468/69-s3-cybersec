services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    restart: unless-stopped
    # ไม่ expose port ออก host — pgAdmin/Strapi ต่อผ่าน internal network ของ compose อยู่แล้ว
    # เข้าจาก host ใช้ `docker compose exec db psql -U <user>` แทน
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_DB}
      # สร้าง pg_hba.conf ให้ใช้ scram-sha-256 ตั้งแต่ initdb (ทั้ง local socket + TCP)
      # แก้ปัญหา trust auth ที่ first-match-wins ชนะบรรทัด scram ที่ append ทีหลัง
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      # defense-in-depth: บังคับให้ TCP connections ใช้ scram-sha-256 (default ของ image = md5)
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      STRAPI_DB_USER: ${STRAPI_DB_USER}
      STRAPI_DB_PASSWORD: ${STRAPI_DB_PASSWORD}
    volumes:
      # named volume — ไม่ทิ้งไฟล์ Postgres บน host ด้วย owner/permission ของ container (แบบ bind mount ./data)
      - db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # hardening — ตัด capability ทั้งหมด เหลือเฉพาะที่จำเป็น (bind :5432 <1024 ในฐานะ non-root)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    memswap_limit: 512m

  admin:
    image: dpage/pgadmin4:9.17
    container_name: 69-s3-admin
    restart: unless-stopped
    ports:
      - 127.0.0.1:${ADMIN_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      # บังคับตั้ง master password ตอน login แรก — เพิ่มชั้นป้องกัน session hijack / brute-force
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=True
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    memswap_limit: 512m

  app:
    image: prawee/strapi:1.1.0
    container_name: 69-s3-app
    restart: unless-stopped
    ports:
      - 127.0.0.1:${APP_PORT}:1337
    environment:
      - DATABASE_CLIENT=${DATABASE_CLIENT}
      - DATABASE_NAME=${DATABASE_DB}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USERNAME=${STRAPI_DB_USER}
      - DATABASE_PASSWORD=${STRAPI_DB_PASSWORD}
      # secrets ของ Strapi — ถ้าไม่ตั้ง จะ fallback ไปค่า default ที่เดาได้ = ปลอม JWT ได้
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    memswap_limit: 1024m

volumes:
  db_data:
